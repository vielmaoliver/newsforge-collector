name: NewsForge fallback collector

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsforge-fallback-collector
  cancel-in-progress: true

jobs:
  collect:
    if: ${{ vars.NEWSFORGE_COLLECTOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: python -m pip install "uv==0.9.24"

      - name: Sync locked runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Run fallback collector
        env:
          NEWSFORGE_API_URL: ${{ vars.NEWSFORGE_API_URL }}
          COLLECTOR_INGEST_SECRET: ${{ secrets.COLLECTOR_INGEST_SECRET }}
        run: uv run --frozen --no-dev newsforge-collector
