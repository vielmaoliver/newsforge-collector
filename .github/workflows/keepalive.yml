name: Keep scheduled collector active

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    if: ${{ vars.NEWSFORGE_COLLECTOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refresh activity marker
        shell: bash
        run: |
          mkdir -p .status
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .status/keepalive.txt
          git config user.name "newsforge-keepalive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .status/keepalive.txt
          git diff --cached --quiet || git commit -m "chore: refresh collector keepalive"
          git push
